# 試作時の待機費用とスケールを抑える。月額料金の上限ではない。
runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512
env:
  # Googleマップの表示時取得。キーは実行時だけ使用し、ビルドやブラウザーへ渡さない。
  - variable: GOOGLE_PLACES_API_KEY
    secret: tsugikoko-google-places-api-key@1
    availability: [RUNTIME]
  - variable: GOOGLE_PLACES_DAILY_LIMIT
    value: "100"
    availability: [RUNTIME]
  - variable: GOOGLE_PLACES_MONTHLY_LIMIT
    value: "4000"
    availability: [RUNTIME]
  # 外部サービスとFirebaseで設定済みの認証方法だけを表示する。
  - variable: NEXT_PUBLIC_AUTH_PROVIDERS
    value: "google.com,twitter.com,facebook.com"
    availability: [BUILD, RUNTIME]
  # GA4の測定ID。拡張計測機能はGA4の管理画面で無効にしておく。
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: "G-FRBRZ4W4C1"
    availability: [BUILD, RUNTIME]
  # Google広告の新規登録イベント。公開ラベルをビルド時にも埋め込む。
  - variable: NEXT_PUBLIC_GOOGLE_ADS_SIGNUP_LABEL
    value: "X0s2CPyIg64dEKfF44RF"
    availability: [BUILD, RUNTIME]
  # 店舗情報の取得ジョブ。無効・未設定の環境では応答後の処理（after）に戻る。
  # キューと呼び出し用サービスアカウントを作成してから "true" にする。
  - variable: PLACE_TASKS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: PLACE_TASKS_QUEUE
    value: "projects/tsugikoko/locations/asia-east1/queues/place-extraction"
    availability: [RUNTIME]
  - variable: PLACE_TASKS_INVOKER
    value: "place-tasks-invoker@tsugikoko.iam.gserviceaccount.com"
    availability: [RUNTIME]
  - variable: PLACE_TASKS_URL
    value: "https://tsugikoko--tsugikoko.asia-east1.hosted.app/api/internal/place-extraction"
    availability: [RUNTIME]
  # 退会後の削除。専用キューで待機・再試行し、ブラウザーを閉じても継続する。
  - variable: ACCOUNT_DELETION_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: ACCOUNT_DELETION_QUEUE
    value: "projects/tsugikoko/locations/asia-east1/queues/account-deletion"
    availability: [RUNTIME]
  - variable: ACCOUNT_DELETION_INVOKER
    value: "place-tasks-invoker@tsugikoko.iam.gserviceaccount.com"
    availability: [RUNTIME]
  - variable: ACCOUNT_DELETION_URL
    value: "https://tsugikoko--tsugikoko.asia-east1.hosted.app/api/internal/account-deletion"
    availability: [RUNTIME]
  # 日次集計。Cloud Schedulerが毎日呼び出し、BigQueryのanalytics.daily_metricsへ件数だけを書き込む。
  - variable: METRICS_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: METRICS_DATASET
    value: "tsugikoko.analytics"
    availability: [RUNTIME]
  - variable: METRICS_INVOKER
    value: "metrics-invoker@tsugikoko.iam.gserviceaccount.com"
    availability: [RUNTIME]
  - variable: METRICS_URL
    value: "https://tsugikoko.com/api/internal/metrics"
    availability: [RUNTIME]
